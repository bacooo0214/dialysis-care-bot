name: Keepalive Dialysis Care Bot

on:
  schedule:
    # 每 10 分鐘自動 ping 一次 Render 健康端點，防止 15 分鐘無人使用時休眠
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Send Health Check Ping
        run: |
          response=$(curl -s -w "%{http_code}" https://dialysis-care-bot.onrender.com/health -o /dev/null)
          echo "Render Health Check Status: $response"
          if [ "$response" -ne 200 ]; then
            echo "Failed with HTTP $response"
            exit 1
          fi
